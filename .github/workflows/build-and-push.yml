name: Build and Push

on:
  push:
    tags:
      - "kronize-v*"
      - "python-runner-v*"

jobs:
  kronize:
    if: startsWith(github.ref_name, 'kronize-v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Docker login
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ secrets.REGISTRY_URL }}/kronize/kronize:${{ github.ref_name }}
            ${{ secrets.REGISTRY_URL }}/kronize/kronize:latest

  python-runner:
    if: startsWith(github.ref_name, 'python-runner-v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Docker login
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: docker/python-runner
          file: docker/python-runner/Dockerfile
          push: true
          tags: |
            ${{ secrets.REGISTRY_URL }}/kronize/python-runner:${{ github.ref_name }}
            ${{ secrets.REGISTRY_URL }}/kronize/python-runner:latest
