services:
  kronize:
    image: ${REGISTRY_URL}/kronize/kronize:kronize-v1.0.4
    container_name: kronize
    restart: unless-stopped
    networks:
      - nginx_proxy
    expose:
      - "6182"
    environment:
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET required}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin}
      - ADDR=:6182
      - REGISTRY_URL=${REGISTRY_URL:?REGISTRY_URL required}
    volumes:
      - kronize-data:/data
      - kronize-scripts:/data/scripts

  python-runner:
    image: ${REGISTRY_URL}/kronize/python-runner:python-runner-v1.0.0
    container_name: kronize-python-runner
    restart: unless-stopped
    entrypoint: ["sleep", "infinity"]

volumes:
  kronize-data:
  kronize-scripts:

networks:
  nginx_proxy:
    external: true
